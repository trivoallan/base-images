# git sur Alpine, l'image `git` du WorkflowTemplate d'uske (checkout, journaux).
#
# Régime rebuild (ADR 0015) : apk, reconstruit depuis le miroir `alpine` que déclare
# KNOCK_TRANSFORM_PACKAGE_MIRRORS dans screening.yml.
#
# La destination `ghcr` est un hôte avec préfixe de chemin (ghcr.io/<propriétaire>), déclaré
# dans KNOCK_REGISTRIES par le workflow, jamais ici.
apiVersion: knock.io/v1alpha1
kind: MirrorPolicy
metadata:
  name: git-2
  labels:
    admission-track: rebuild            # → playbooks/rebuild.yaml
    major: "2"
    cao: oci-maintainers
spec:
  artifactType: image
  # GHCR refuse la suppression par l'API : un tag sorti de la sélection est marqué, jamais effacé.
  deletionMode: mark
  source:
    registry: docker.io
    repository: alpine/git
  imports:
    - name: main
      owners: [group:default/oci-maintainers]
      tags:
        includeRegex: "^v2\\.54\\.\\d+$"
        aliases: ["v{major}.{minor}"]
      platforms: [linux/amd64, linux/arm64]
      transform:
        - rewritePackageSources: { mirror: alpine }
      remediate:
        - upgradePackages: {}  # sur ordre d'uske seulement ; l'epoch vient avec l'ordre
      destinations:
        - registry: ghcr
          project: oci
          repository: git
