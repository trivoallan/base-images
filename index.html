<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Rien hors du site publié : le journal et les rapports sont servis à côté de cette page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Journal des décisions</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --fg: #1b1b1a; --muted: #6b6a66; --line: #e3e2de; --surface: #ffffff;
    --refus: #b42318; --refus-bg: #fdecea; --doute: #9a5b00; --doute-bg: #fff4e0;
    --transfo: #766000; --transfo-bg: #fbf3cc;
    --ok: #1e6b37; --ok-bg: #e8f4ec; --autre: #3d3c39; --autre-bg: #ecebe8; --link: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --fg: #ecebe8; --muted: #9b9a95; --line: #2e2d2b; --surface: #1d1d1c;
      --refus: #ff8f84; --refus-bg: #3a1714; --doute: #ffc266; --doute-bg: #352610;
      --transfo: #f2d14b; --transfo-bg: #2e2a10;
      --ok: #86d29b; --ok-bg: #14301d; --autre: #d6d4cf; --autre-bg: #2a2928; --link: #8fb3ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 52rem; padding: 1.5rem 1rem 3rem; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  a { color: var(--link); }
  a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .lede { margin: 0 0 1.25rem; color: var(--muted); }
  .filter { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem; padding: .5rem 0; background: var(--bg); }
  /* Collée en haut seulement quand elle tient sur une ligne : sur téléphone, elle mangerait l'écran. */
  @media (min-width: 40rem) { .filter { position: sticky; top: 0; z-index: 1; } }
  .filter button, .filter input, .empty button { font: inherit; min-height: 44px; padding: 0 1rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: inherit; }
  .filter button, .empty button { cursor: pointer; }
  .empty button { margin-top: .5rem; color: var(--fg); }
  .filter button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .filter input { flex: 1 1 14rem; min-width: 0; }
  #list { display: grid; gap: .75rem; }
  .image { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 6px; padding: 1rem 1rem .75rem; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; }
  .head h2 { margin: 0; font-size: 1.15rem; font-weight: 650; overflow-wrap: anywhere; }
  .pill { display: inline-block; font-size: .8rem; font-weight: 600; padding: .1rem .55rem; border-radius: 999px; color: var(--c); background: var(--cbg); white-space: nowrap; }
  .why { margin: .35rem 0 0; font-weight: 500; }
  .why, .rule { position: relative; margin: .35rem 0 0; }
  .why code, .rule code { font-size: .9rem; }
  /* L'explication d'un code : au survol, au focus clavier et au toucher (le bouton prend le focus). */
  .tip button { position: relative; font: 600 .75rem/1 system-ui, sans-serif; width: 1.5rem; height: 1.5rem; margin-left: .35rem; padding: 0; vertical-align: .1em; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); cursor: help; }
  .tip button::before { content: ""; position: absolute; inset: -10px; }
  .tipbox { display: none; position: absolute; left: 0; top: 100%; z-index: 2; max-width: min(32rem, 100%); margin-top: .35rem; padding: .6rem .75rem; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: .9rem; font-weight: 400; line-height: 1.4; }
  .tipbox .msg { display: block; margin-top: .25rem; opacity: .8; }
  .tipbox .step { display: block; margin-top: .35rem; }
  .head { position: relative; }
  .tip.badge button { width: auto; height: auto; margin: 0; padding: .1rem .55rem; vertical-align: baseline; font-size: .8rem; color: var(--muted); background: none; }
  .tip.badge .tipbox .msg:first-child { margin-top: 0; }
  .tip:hover .tipbox, .tip:focus-within .tipbox { display: block; }
  .arb { margin: .35rem 0 0; padding-left: .75rem; border-left: 2px solid var(--line); color: var(--muted); }
  .meta { margin: .35rem 0 0; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
  .meta code { font-size: .95em; }
  .actions { margin-top: .75rem; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; }
  .report { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem; border-radius: 6px; background: var(--fg); color: var(--bg); font-weight: 600; text-decoration: none; }
  .none { color: var(--muted); font-size: .9rem; }
  details { margin-top: .75rem; border-top: 1px solid var(--line); padding-top: .5rem; }
  summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--muted); font-size: .9rem; }
  .rail { list-style: none; margin: .75rem 0 .5rem; padding: 0 0 0 1.25rem; position: relative; }
  .rail::before { content: ""; position: absolute; left: .4rem; top: .5rem; bottom: .5rem; width: 2px; background: var(--line); }
  .rail li { position: relative; padding: 0 0 .9rem; }
  .rail li:last-child { padding-bottom: 0; }
  .rail li::before { content: ""; position: absolute; left: -1.15rem; top: .45rem; width: .7rem; height: .7rem; border-radius: 50%; background: var(--c, var(--muted)); box-shadow: 0 0 0 3px var(--surface); }
  .rail li.derived::before { width: .55rem; height: .55rem; background: var(--surface); border: 2px solid var(--muted); }
  .rail .role { font-weight: 600; }
  .rail .when { font-size: .85rem; color: var(--muted); }
  .rail .what { margin: .1rem 0 0; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
  .rail .what code { font-size: .95em; color: var(--fg); }
  /* La méta de la carte se détache du fil : un filet et de l'air, comme une note en pied. */
  .rail + .meta { margin-top: 1rem; padding-top: .75rem; border-top: 1px solid var(--line); }
  .s-refus { --c: var(--refus); --cbg: var(--refus-bg); }
  .s-doute { --c: var(--doute); --cbg: var(--doute-bg); }
  .s-transfo { --c: var(--transfo); --cbg: var(--transfo-bg); }
  .s-ok { --c: var(--ok); --cbg: var(--ok-bg); }
  .s-autre { --c: var(--autre); --cbg: var(--autre-bg); }
  .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
  .filter input::placeholder { color: var(--muted); opacity: 1; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>Journal des décisions</h1>
  <p class="lede">Ce que la porte a refusé ou placé, image par image. Le rapport <code>regis</code> dit quelle règle a tranché.</p>
</header>
<div class="filter" role="group" aria-label="Images affichées">
  <button type="button" data-all="false" aria-pressed="true">Refus et inconclusive</button>
  <button type="button" data-all="true" aria-pressed="false">Tout</button>
  <input type="search" id="q" placeholder="Filtrer par image" aria-label="Filtrer par image" autocomplete="off">
</div>
<p id="status" class="sr-only" role="status"></p>
<main id="list"><p class="empty">Chargement…</p></main>
<script>
// Les états qu'uske sait produire, avec leur libellé et leur gravité. Tout autre état (abandoned,
// placed-by-exception, un état futur) est écrit à la main ou nouveau : il reste visible par défaut.
const STATES = {
  "quarantine": { label: "Refusée", cls: "s-refus", sev: 4 },
  "inconclusive": { label: "Inconclusive", cls: "s-doute", sev: 3 },
  "transformation-required": { label: "Transformation requise", cls: "s-transfo", sev: 1 },
  "direct-placement": { label: "Placement direct", cls: "s-ok", sev: 0 },
};
const HIDDEN_BY_DEFAULT = new Set(["direct-placement", "transformation-required"]);
// Les raisons qu'uske écrit, dites pour qui ne connaît pas uske. Le code brut reste affiché à côté ;
// une raison inconnue s'affiche telle quelle.
const REASONS = {
  "uske/rebuild-refused": "Même reconstruite pour corriger ses failles, l'image ne passe toujours pas les règles.",
  "cve/cve-count": "Trop de vulnérabilités connues : l'image doit être reconstruite avant d'être placée.",
};
const LEVELS = { critical: "critique", warning: "avertissement" };
// Les étapes qu'une policy knock déclare, dites en français. Une étape inconnue garde son seul nom.
const STEPS = {
  rewritePackageSources: o => `Sources de paquets réécrites vers le miroir « ${o?.mirror ?? "?"} ».`,
  upgradePackages: () => "Paquets mis à jour à leur dernière version.",
};
const list = document.getElementById("list");
const buttons = document.querySelectorAll(".filter button");
const search = document.getElementById("q");
const announce = document.getElementById("status");
let images = [];
let rulesets = {};
let policyInfo = {};
let all = false;

const info = s => STATES[s] || { label: s || "?", cls: "s-autre", sev: 2 };

// Tout ce qui vient du journal passe par textContent : jamais interprété comme du HTML.
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function link(text, href, cls) {
  const a = el("a", text, cls);
  a.href = href;
  return a;
}

async function exists(url) {
  try { return (await fetch(url, { method: "HEAD" })).ok; } catch { return false; }
}

// Le rapport se déduit de la politique et du digest, pas du champ `report`, qui suit trois
// conventions (.md, chemin du volume uske, absent). Le HTML d'abord, puis le Markdown. Résolu une
// fois par décision : la recherche redessine la page sans refaire les requêtes.
let tips = 0;
function tip(...content) {
  const w = el("span", null, "tip");
  const b = el("button", "?");
  b.type = "button";
  b.setAttribute("aria-label", "Explication");
  const box = el("span", null, "tipbox");
  box.id = `tip-${++tips}`;
  box.setAttribute("role", "tooltip");
  box.append(...content);
  b.setAttribute("aria-describedby", box.id);
  w.append(b, box);
  return w;
}

const reports = new Map();
function resolveReport(policy, digest) {
  if (!digest) return Promise.resolve(null);
  const base = `results/reports/${encodeURIComponent(policy)}/${encodeURIComponent(digest)}`;
  if (!reports.has(base)) reports.set(base, (async () => {
    if (await exists(base + ".html")) return { href: base + ".html", md: false };
    if (await exists(base + ".md")) return { href: base + ".md", md: true };
    return null;
  })());
  return reports.get(base);
}

// Le bouton principal d'une carte (`primary`), ou un simple lien.
async function fillReport(slot, policy, digest, text, primary) {
  const r = await resolveReport(policy, digest);
  if (!r) return slot.replaceChildren(el("span", "pas de rapport", "none"));
  slot.replaceChildren(link(r.md ? text + " (md)" : text, r.href, primary ? "report" : null));
}

// Un refus après reconstruction tient au rapport de l'image reconstruite : sa première règle en
// échec, la plus grave, est ce qui bloque encore. Lue dans le .md, qui la donne en tableau.
// ponytail: dépend du tableau Markdown de regis ; en cas d'échec, la raison uske prend sa place.
async function fillRule(slot, policy, digest, fallback) {
  let p = null;
  try {
    const r = await fetch(`results/reports/${encodeURIComponent(policy)}/${encodeURIComponent(digest)}.md`);
    const text = r.ok ? (await r.text()).split("<!-- regis -->")[1] || "" : "";
    const m = text.match(/^\| ✗ \| ([^|]+?) \| ([^|]+?) \| (.+?) \|$/m);
    if (m) {
      p = el("p", "Bloqué par : ", "rule");
      const msg = el("span", m[3], "msg");
      msg.lang = "en";
      p.append(el("code", m[1]), tip(`Ce qui bloque encore : ${m[1]} (${LEVELS[m[2]] || m[2]}).`, msg));
    }
  } catch {}
  // Sans règle lisible, la raison remonte sur la carte : elle dit toujours pourquoi.
  slot.replaceWith(...(p ? [p] : fallback));
}

// Le ruleset est le sha256 du playbook qui a jugé : rulesets.json donne sa source à ce commit.
function ruleset(d) {
  const code = el("code", (d.ruleset || "").replace(/^sha256:/, "").slice(0, 12));
  const src = rulesets[d.ruleset];
  if (typeof src !== "string" || !src.startsWith("https://")) return code;
  const a = link("", src);
  a.title = d.ruleset;
  a.setAttribute("aria-label", `source du ruleset ${code.textContent}`);
  a.append(code);
  return a;
}

// policies.json, publié avec la page, donne le fichier de chaque policy à ce commit.
function policyLink(name) {
  const src = policyInfo[name]?.url;
  if (typeof src !== "string" || !src.startsWith("https://")) return name;
  return link(name, src);
}

// Ce que le journal prouve d'une image : reconstruite par sa transformation (une ligne porte
// `rebuilt` ou `source`), réparée sur ordre d'uske (une image tenue porte `epoch`, ou la source est
// close en `uske/remediation-refused`). `uske/rebuild-refused` précède les ordres : pas réparée.
const transformed = img => img.decisions.some(x => x.rebuilt || x.source);
const remediated = img => img.decisions.some(x => (x.source && x.epoch) || x.reason === "uske/remediation-refused");

// Un badge après le statut ; au survol, les étapes que la policy déclare, une par ligne.
function badge(label, steps, intro) {
  const content = [el("span", intro, "msg")];
  for (const step of steps || []) {
    const [name, opts] = Object.entries(step)[0] || ["?", null];
    const line = el("span", null, "step");
    line.append(el("code", name));
    if (STEPS[name]) line.append(" : ", STEPS[name](opts));
    content.push(line);
  }
  if (!steps?.length) content.push(el("span", "Étapes inconnues : la policy n'a pas été trouvée.", "step"));
  const t = tip(...content);
  t.classList.add("badge");
  t.querySelector("button").textContent = label;
  t.querySelector("button").removeAttribute("aria-label");
  return t;
}

function badges(img) {
  const pol = policyInfo[img.head.policy];
  const out = [];
  if (transformed(img)) out.push(badge("Transformée", pol?.transform, "Reconstruite par les étapes de transformation de sa policy :"));
  if (remediated(img)) out.push(badge("Réparée", pol?.remediate, "Réparée sur ordre d'uske, par les étapes de réparation de sa policy :"));
  return out;
}

const when = d => (d.ts || "").replace("T", " ").replace(/:\d\dZ$/, " UTC");

function meta(d) {
  const p = el("p", null, "meta");
  p.append(when(d), " · policy ", policyLink(d.policy));
  if (d.ruleset) p.append(" · ruleset ", ruleset(d));
  p.append(" · ", d.ref || d.raw || "");
  return p;
}

function why(d) {
  const out = [];
  if (d.reason) {
    const p = el("p", "Raison : ", "why");
    p.append(el("code", d.reason));
    if (REASONS[d.reason]) p.append(tip(REASONS[d.reason]));
    out.push(p);
  }
  if (d.arbitration) {
    const a = d.arbitration;
    out.push(el("p", `Arbitrage ${a.by || "?"}, ${a.date || "?"} : ${a.reason || ""}`, "arb"));
  }
  return out;
}

// « Statut : » pour les lecteurs d'écran, que la couleur et la place de la pastille ne renseignent pas.
function pill(label) {
  const p = el("span", null, "pill");
  p.append(el("span", "Statut : ", "sr-only"), label);
  return p;
}

// L'historique en fil vertical, du plus ancien au plus récent. Chaque point dit qui a été jugé : la
// source, sa reconstruction (ligne `source`), ou la source close (ligne `rebuilt`). À la même seconde,
// le jugement d'une reconstruction précède la clôture de sa source. Le passage par knock se déduit
// du journal sans y être daté : un point creux, sans heure.
function role(x) {
  if (x.source) return "Reconstruction jugée";
  if (x.rebuilt) return "Source close";
  if (x.reason === "uske/reopened") return "Source rouverte";
  return "Source jugée";
}

function rail(img) {
  const events = [...img.decisions].sort((a, b) => (a.ts || "").localeCompare(b.ts || "") || !!b.source - !!a.source);
  const ol = el("ol", null, "rail");
  let knock = false;
  for (const x of events) {
    if (x.source && !knock) {
      knock = true;
      const li = el("li", null, "derived");
      li.append(el("span", "Reconstruite par knock", "role"));
      const what = el("p", "transformation de la policy ", "what");
      what.append(el("code", x.policy), ", vers ", (x.ref || "").split("/").slice(0, -1).join("/"));
      li.append(what);
      ol.append(li);
    }
    const xs = info(x.state);
    const li = el("li", null, xs.cls);
    li.append(el("span", role(x), "role"), el("span", ` · ${short(x)} `, "when"), pill(xs.label));
    const what = el("p", null, "what");
    if (x.reason) what.append(el("code", x.reason), " · ");
    const r = el("span", "…", "none");
    what.append(x.ref || x.raw || "", " · ", r);
    fillReport(r, x.policy, x.digest, "rapport", false);
    li.append(what);
    ol.append(li);
  }
  return ol;
}

const short = d => (d.ts || "").replace(/^\d{4}-(\d\d)-(\d\d)T(\d\d:\d\d).*/, "$2/$1 $3 UTC");

function card(img) {
  const d = img.head;
  const s = info(d.state);
  const art = el("article", null, "image " + s.cls);
  const head = el("div", null, "head");
  head.append(el("h2", img.name), pill(s.label), ...badges(img));
  art.append(head);
  // La carte dit quoi et pourquoi ; l'historique, la méta et la source se déplient.
  const more = [];
  const reason = why(d);
  if (d.rebuilt) {
    const rule = el("span");
    art.append(rule);
    fillRule(rule, d.policy, d.rebuilt, reason);
  } else art.append(...reason);
  more.push(meta(d));
  const actions = el("div", null, "actions");
  const slot = el("span", "…", "none");
  actions.append(slot);
  art.append(actions);
  // Le verdict qui a fait refuser est celui de la reconstruction ; celui de la source est dans le fil.
  if (d.rebuilt) fillReport(slot, d.policy, d.rebuilt, "Rapport de l'image reconstruite", true);
  else fillReport(slot, d.policy, d.digest, "Ouvrir le rapport", true);
  const det = el("details");
  det.append(el("summary", "Détails et historique"), rail(img), ...more);
  art.append(det);
  return art;
}

// La recherche et la bascule vivent dans l'URL : `?q=redis:7.2.9-alpine3.21` se partage et ouvre
// directement la carte de cette image, historique déplié.
function syncUrl() {
  const u = new URL(location.href);
  const q = search.value.trim();
  if (q) u.searchParams.set("q", q); else u.searchParams.delete("q");
  if (all) u.searchParams.set("tout", "1"); else u.searchParams.delete("tout");
  history.replaceState(null, "", u);
}

function setAll(value) {
  all = value;
  buttons.forEach(o => o.setAttribute("aria-pressed", String((o.dataset.all === "true") === all)));
  render();
}

function action(text, onclick) {
  const b = el("button", text);
  b.type = "button";
  b.addEventListener("click", onclick);
  return b;
}

// Un état vide dit pourquoi il est vide : le filtre par défaut cache des images, ou rien ne
// correspond à la recherche.
function empty(q, found) {
  const p = el("p", null, "empty");
  const term = q ? ` pour « ${q} »` : "";
  if (!all && found) p.append(`Aucun refus ni inconclusive${term}. `, action(`Tout afficher (${found})`, () => setAll(true)));
  else if (q) p.append(`Aucune image ne correspond à « ${q} ». `, action("Effacer la recherche", () => { search.value = ""; render(); search.focus(); }));
  else p.append("Aucune image dans le journal.");
  return p;
}

function render() {
  const raw = search.value.trim();
  const q = raw.toLowerCase();
  const found = images.filter(i => i.decisions.some(d => (d.ref || d.raw || "").toLowerCase().includes(q)));
  const kept = found.filter(i => !HIDDEN_BY_DEFAULT.has(i.head.state));
  const shown = all ? found : kept;
  buttons[0].textContent = `Refus et inconclusive (${kept.length})`;
  buttons[1].textContent = `Tout (${found.length})`;
  syncUrl();
  announce.textContent = shown.length === 1 ? "1 image affichée" : `${shown.length} images affichées`;
  if (!shown.length) return list.replaceChildren(empty(raw, found.length));
  const cards = shown.map(card);
  // Une seule image retenue : c'est celle qu'on est venu voir, son historique s'ouvre.
  if (q && cards.length === 1) cards[0].querySelector("details")?.setAttribute("open", "");
  list.replaceChildren(...cards);
}

search.addEventListener("input", render);

buttons.forEach(b => b.addEventListener("click", () => setAll(b.dataset.all === "true")));

{
  const params = new URLSearchParams(location.search);
  search.value = params.get("q") || "";
  all = params.has("tout");
  buttons.forEach(o => o.setAttribute("aria-pressed", String((o.dataset.all === "true") === all)));
}

// Une image se reconnaît à son nom:tag, quel que soit son registre : la source et sa
// reconstruction (base-transit) racontent la même histoire sur une seule carte.
const nameOf = d => (d.ref || d.raw || "?").split("/").pop();

async function load() {
  // Sans correspondance publiée (copie locale, ancien déploiement), les rulesets restent sans lien.
  rulesets = await fetch("results/rulesets.json").then(r => r.ok ? r.json() : {}).catch(() => ({}));
  policyInfo = await fetch("results/policies.json").then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const policies = await (await fetch("results/index.json")).json();
  const lines = [];
  for (const policy of policies) {
    const text = await (await fetch(`results/${encodeURIComponent(policy)}.jsonl`)).text();
    for (const raw of text.split("\n")) {
      if (!raw.trim()) continue;
      // Une ligne illisible est montrée telle quelle, sous un état inconnu : aucune ligne perdue.
      try { lines.push({ policy, ...JSON.parse(raw) }); }
      catch { lines.push({ policy, raw, state: "illisible" }); }
    }
  }
  // La plus récente d'abord ; à la même seconde, la plus grave : le refus d'une source est écrit
  // en même temps que le jugement de sa reconstruction, et c'est lui qui tranche.
  lines.sort((a, b) => (b.ts || "").localeCompare(a.ts || "") || info(b.state).sev - info(a.state).sev);
  const groups = new Map();
  for (const d of lines) {
    const k = nameOf(d);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(d);
  }
  images = [...groups].map(([name, decisions]) => ({ name, decisions, head: decisions[0] }));
  render();
}

load().catch(e => list.replaceChildren(el("p", "Journal illisible : " + e.message, "empty")));
</script>
</body>
</html>
